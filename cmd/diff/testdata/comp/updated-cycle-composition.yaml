# testdata/diff/resources/cycle/compositions.yaml's XCycleA composition with a spec change (a label
# on the composed XCycleB), so comp evaluates its composites at every --analyze-on setting.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xcycleas.cycle.example.org
spec:
  compositeTypeRef:
    apiVersion: ns.cycle.example.org/v1alpha1
    kind: XCycleA
  mode: Pipeline
  pipeline:
    - step: generate-cycle-b
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: ns.cycle.example.org/v1alpha1
            kind: XCycleB
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}-child
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cycle-b
              labels:
                cycle.example.org/edited: "true"
            spec:
              cycleField: {{ .observed.composite.resource.spec.cycleField }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
