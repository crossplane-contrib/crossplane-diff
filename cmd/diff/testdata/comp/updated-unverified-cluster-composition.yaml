# Adds two ConfigMaps in a namespace that does not exist in the cluster.
#
# A cluster-scoped XR may compose resources in any namespace (a namespaced one is confined to its
# own), which is what lets `comp` reach a missing namespace from an XR that already exists. Both
# additions' dry-run creates are refused for want of the namespace, so both are diffed unverified,
# and the warning saying so counts them.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xnopresources-unverified.diff.example.org
spec:
  compositeTypeRef:
    apiVersion: diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}-first
              namespace: nonexistent-namespace
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: first-config
            data:
              configData: {{ .observed.composite.resource.spec.coolField }}
            ---
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}-second
              namespace: nonexistent-namespace
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: second-config
            data:
              configData: {{ .observed.composite.resource.spec.coolField }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
