# The CompositionRevision Crossplane creates for compositions.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. The XR in existing-cycle-xr.yaml tracks it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: xcycleas.cycle.example.org-e7860b5
  labels:
    crossplane.io/composition-name: xcycleas.cycle.example.org
    crossplane.io/composition-hash: e7860b5a9983f17c574fca2382519315b73dc0e3a59c8f1a62e718a08625cbc
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: ns.cycle.example.org/v1alpha1
    kind: XCycleA
  mode: Pipeline
  pipeline:
    - step: generate-cycle-b
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: ns.cycle.example.org/v1alpha1
            kind: XCycleB
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}-c
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cycle-b
            spec:
              cycleField: {{ .observed.composite.resource.spec.cycleField }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
