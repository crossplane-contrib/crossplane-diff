# The backing XR Crossplane's claim syncer created for existing-claim-1.yaml. Its composed resource is
# existing-claim-downstream-1.yaml.
apiVersion: diff.example.org/v1alpha1
kind: XNop
metadata:
  name: test-claim-1-xr
  labels:
    crossplane.io/claim-name: test-claim-1
    crossplane.io/claim-namespace: test-namespace
spec:
  claimRef:
    apiVersion: diff.example.org/v1alpha1
    kind: NopClaim
    name: test-claim-1
    namespace: test-namespace
  coolField: claim-value-1
  compositeDeletePolicy: Background
  compositionUpdatePolicy: Automatic
  compositionRef:
    name: nopclaims.diff.example.org
  resourceRefs:
  - apiVersion: nop.example.org/v1alpha1
    kind: XDownstreamResource
    name: test-claim-1-xr
