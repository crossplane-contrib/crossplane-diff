# The in-cluster version of updated-unverified-cluster-composition.yaml: a composition for the
# cluster-scoped XNopResource that composes nothing yet.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xnopresources-unverified.diff.example.org
spec:
  compositeTypeRef:
    apiVersion: diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
