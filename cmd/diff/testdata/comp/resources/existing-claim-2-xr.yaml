# The backing XR Crossplane's claim syncer created for existing-claim-2.yaml. Its composed resource is
# existing-claim-downstream-2.yaml.
apiVersion: diff.example.org/v1alpha1
kind: XNop
metadata:
  name: test-claim-2-xr
spec:
  claimRef:
    apiVersion: diff.example.org/v1alpha1
    kind: NopClaim
    name: test-claim-2
    namespace: test-namespace
  coolField: claim-value-2
  compositeDeletePolicy: Background
  compositionUpdatePolicy: Automatic
  compositionRef:
    name: nopclaims.diff.example.org
  resourceRefs:
  - apiVersion: nop.example.org/v1alpha1
    kind: XDownstreamResource
    name: test-claim-2-xr
