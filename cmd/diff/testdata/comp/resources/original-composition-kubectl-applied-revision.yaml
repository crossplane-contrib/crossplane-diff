# The CompositionRevision Crossplane creates for original-composition-kubectl-applied.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. Crossplane copies the composition's annotations, kubectl's
# last-applied-configuration among them, onto the revision. The XR in
# existing-xr-1-kubectl-applied.yaml tracks it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: xnopresources.diff.example.org-8860b3f
  labels:
    crossplane.io/composition-name: xnopresources.diff.example.org
    crossplane.io/composition-hash: 8860b3f08e9d412d52633b8e5da5d6e0544062c1c433e404bd5b932e6dd2d6f
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: "{\"apiVersion\":\"apiextensions.crossplane.io/v1\",\"kind\":\"Composition\",\"metadata\":{\"name\":\"xnopresources.diff.example.org\"},\"spec\":{\"compositeTypeRef\":{\"apiVersion\":\"ns.diff.example.org/v1alpha1\",\"kind\":\"XNopResource\"},\"mode\":\"Pipeline\"}}\n"
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nop-resource
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.coolField }}
                resourceTier: basic
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
