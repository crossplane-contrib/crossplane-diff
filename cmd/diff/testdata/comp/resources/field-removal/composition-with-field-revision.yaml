# The CompositionRevision Crossplane creates for composition-with-field.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. The XR in existing-xr.yaml tracks it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: xfieldremoval.diff.example.org-e25a602
  labels:
    crossplane.io/composition-name: xfieldremoval.diff.example.org
    crossplane.io/composition-hash: e25a602c8f00e75a8d5bfa696d0f1c91d25cada917239ae463f10f8990488d5
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nop-resource
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.coolField }}
                removableField: will-be-removed
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
