# existing-xr-1.yaml where the composition was applied with a client-side `kubectl apply` of the
# file being diffed (original-composition-kubectl-applied-current.yaml). Composition.Hash() covers
# annotations, so that composition's revision has a different name, and this is the one the XR tracks.
apiVersion: ns.diff.example.org/v1alpha1
kind: XNopResource
metadata:
  name: test-resource
  namespace: default
spec:
  coolField: existing-value
  crossplane:
    compositionRef:
      name: xnopresources.diff.example.org
