# The CompositionRevision Crossplane creates for collision-composition.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. The XRs in existing-xr-ns-{a,b}.yaml track it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: xnopresources.collision.example.org-163b210
  labels:
    crossplane.io/composition-name: xnopresources.collision.example.org
    crossplane.io/composition-hash: 163b2101da346b4554697172116dfe489afe2605a36a3af8122f643c3f13e81
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: fetch-external-resources
      functionRef:
        name: function-extra-resources
      input:
        apiVersion: extra-resources.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          extraResources:
            # Fetch ConfigMap by name - uses XR's namespace since no namespace specified
            - apiVersion: v1
              kind: ConfigMap
              into: nsConfig
              type: Reference
              ref:
                name: collision-config
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $config := index .context "apiextensions.crossplane.io/extra-resources" "nsConfig" 0 -}}
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: collision-resource
            spec:
              forProvider:
                # This should contain the ConfigMap data from the XR's namespace
                configData: {{ index $config "data" "value" }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
