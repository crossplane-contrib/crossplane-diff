# existing-claim-revision-ref-xr.yaml where the composition was applied with a client-side `kubectl
# apply`. Composition.Hash() covers annotations, so the revision it tracks has a different name.
apiVersion: diff.example.org/v1alpha1
kind: XNop
metadata:
  name: revision-ref-claim-xr
spec:
  claimRef:
    apiVersion: diff.example.org/v1alpha1
    kind: NopClaim
    name: revision-ref-claim
    namespace: test-namespace
  coolField: revision-ref-claim-value
  compositionRef:
    name: xrevisionrefclaims.diff.example.org
