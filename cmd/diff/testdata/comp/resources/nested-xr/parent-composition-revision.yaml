# The CompositionRevision Crossplane creates for parent-composition.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. The XR in existing-parent-xr.yaml tracks it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: xparentresources.parent.diff.example.org-2c8ca41
  labels:
    crossplane.io/composition-name: xparentresources.parent.diff.example.org
    crossplane.io/composition-hash: 2c8ca412defd2edfa8300ad8e1d0bf35f03fb4fc78184a2274ea3454d46f95f
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: parent.diff.example.org/v1alpha1
    kind: XParentResource
  mode: Pipeline
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            ---
            # Direct downstream resource owned by the parent XR
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}-direct
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: direct-resource
            spec:
              forProvider:
                configData: parent-{{ .observed.composite.resource.spec.parentField }}
                resourceTier: parent-tier
            ---
            # Nested XR of type XNopResource - this should use its OWN composition
            apiVersion: ns.diff.example.org/v1alpha1
            kind: XNopResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}-nested
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nested-xr
            spec:
              coolField: {{ .observed.composite.resource.spec.childConfig }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
