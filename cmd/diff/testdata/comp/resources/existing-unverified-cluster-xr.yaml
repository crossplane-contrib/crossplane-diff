# A cluster-scoped XR using unverified-cluster-composition.yaml. It has composed nothing: the
# composition renders ConfigMaps into a namespace that does not exist, so Crossplane cannot create them.
apiVersion: diff.example.org/v1alpha1
kind: XNopResource
metadata:
  name: unverified-xr
spec:
  coolField: existing-value
  crossplane:
    compositionRef:
      name: xnopresources-unverified.diff.example.org
