# The CompositionRevision Crossplane creates for original-composition-2.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. The XR in existing-xr-v2.yaml tracks it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: xnopresources-v2.diff.example.org-6f71e42
  labels:
    crossplane.io/composition-name: xnopresources-v2.diff.example.org
    crossplane.io/composition-hash: 6f71e42f01e2d3157e8326dfa91a7b66890fc126b7f4cf228659fe377b3bd2e
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nop-resource-v2
            spec:
              forProvider:
                configData: v2-updated-{{ .observed.composite.resource.spec.coolField }}
                resourceTier: enterprise
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
