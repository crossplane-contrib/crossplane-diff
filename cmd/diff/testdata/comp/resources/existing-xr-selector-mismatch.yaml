# Deliberately no compositionRevisionRef. The selector matches no revision in the cluster:
# original-composition.yaml has no version label, so neither has its one revision. Crossplane cannot
# select a revision for this XR, so it never writes the ref, and the XR waits for a composition
# labelled version=0.0.1 (updated-composition-labeled.yaml is 0.0.2, so it is not that one).
apiVersion: ns.diff.example.org/v1alpha1
kind: XNopResource
metadata:
  name: selector-mismatch-resource
  namespace: default
spec:
  coolField: selector-existing-value
  crossplane:
    compositionRef:
      name: xnopresources.diff.example.org
    compositionUpdatePolicy: Automatic
    compositionRevisionSelector:
      matchLabels:
        version: 0.0.1
