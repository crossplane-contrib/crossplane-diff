# The CompositionRevision Crossplane creates for claim-revision-templating-composition.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. The backing XR in existing-claim-revision-ref-xr.yaml tracks it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: xrevisionrefclaims.diff.example.org-98b484d
  labels:
    crossplane.io/composition-name: xrevisionrefclaims.diff.example.org
    crossplane.io/composition-hash: 98b484de153d5dfbd19191016233b6aea0816e30cd670f702f1d940c3decd77
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: diff.example.org/v1alpha1
    kind: XNop
  mode: Pipeline
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nop-resource
              name: {{ .observed.composite.resource.metadata.name }}
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.compositionRevisionRef.name }}
                resourceTier: basic
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
