# The CompositionRevision Crossplane creates for revision-templating-composition.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. Revision 2, the latest: the Automatic XR in existing-xr-revision-ref.yaml
# tracks it. revision-templating-composition-older-revision.yaml is revision 1.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: xrevisionrefs.diff.example.org-e36719b
  labels:
    crossplane.io/composition-name: xrevisionrefs.diff.example.org
    crossplane.io/composition-hash: e36719ba3a7eb92e2b7bf1dd0afc9415edee9ba3de69c6dfce1c370686a3574
spec:
  revision: 2
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nop-resource
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.crossplane.compositionRevisionRef.name }}
                resourceTier: basic
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
