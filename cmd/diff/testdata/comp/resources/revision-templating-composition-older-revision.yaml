# An earlier revision of revision-templating-composition.yaml, from when the composition carried a
# channel=stable label it has since dropped: same spec, so only its name differs from revision 2's.
# Named and labelled from the hash of the composition it was cut from, as Crossplane names it. The
# Manual XR in existing-xr-pinned-revision-ref.yaml is pinned to it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: xrevisionrefs.diff.example.org-0d65896
  labels:
    channel: "stable"
    crossplane.io/composition-name: xrevisionrefs.diff.example.org
    crossplane.io/composition-hash: 0d65896833a71cf8200765d398b63baab827bdea34b85320da35da110d90966
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nop-resource
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.crossplane.compositionRevisionRef.name }}
                resourceTier: basic
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
