# The CompositionRevision Crossplane creates for api-version-original-composition.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. The XR in existing-api-version-xr.yaml tracks it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: xapimigrateresources.example.org-079f459
  labels:
    crossplane.io/composition-name: xapimigrateresources.example.org
    crossplane.io/composition-hash: 079f459df7e1ffb4543343bc8ea86fb661a38ddf24480ff3444092babf72a32
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-api-versioned-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: comp.example.org/v1beta1
            kind: XApiMigrateResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}-api-resource
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: api-migrate-resource
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.coolField }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
