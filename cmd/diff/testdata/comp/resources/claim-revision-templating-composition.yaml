# The claim-side counterpart of revision-templating-composition.yaml: the in-cluster copy of a
# composition whose template reads the CompositionRevision's own name off the composite and propagates
# it into a composed resource. XNop is a legacy (claim-capable) XR, so the ref is at the v1 path,
# spec.compositionRevisionRef.
#
# Paired with ../claim-revision-templating-updated-composition.yaml (a label-only edit) and with
# claim-revision-templating-composition-kubectl-applied.yaml (this, plus a stale kubectl annotation).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xrevisionrefclaims.diff.example.org
spec:
  compositeTypeRef:
    apiVersion: diff.example.org/v1alpha1
    kind: XNop
  mode: Pipeline
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nop-resource
              name: {{ .observed.composite.resource.metadata.name }}
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.compositionRevisionRef.name }}
                resourceTier: basic
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
