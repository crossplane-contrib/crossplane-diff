# The backing XR Crossplane's claim syncer created for existing-claim.yaml, and whose name it wrote to
# that claim's spec.resourceRef. Its composed resource is existing-claim-downstream-resource.yaml.
apiVersion: diff.example.org/v1alpha1
kind: XNopResource
metadata:
  name: test-claim-82crv
  generateName: test-claim-
  labels:
    crossplane.io/claim-name: test-claim
    crossplane.io/claim-namespace: existing-namespace
    crossplane.io/composite: test-claim-82crv
spec:
  coolField: existing-value
  compositionUpdatePolicy: Automatic
  compositionRef:
    name: claim-composition
  compositionRevisionRef:
    name: claim-composition-default
  claimRef:
    apiVersion: diff.example.org/v1alpha1
    kind: NopClaim
    name: test-claim
    namespace: existing-namespace
  resourceRefs:
    - apiVersion: nop.example.org/v1alpha1
      kind: XDownstreamResource
      name: test-claim-82crv
