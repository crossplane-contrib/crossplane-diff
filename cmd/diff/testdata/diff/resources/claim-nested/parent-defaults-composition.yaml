# Renders, into a composed resource, the two fields of its XR that only the XR's CRD defaults:
# spec.tier (a user default, which the claim's CRD shares) and spec.compositionUpdatePolicy (machinery,
# which the claim's CRD does not default). A claim whose manifest omits both therefore shows, in this
# resource, whether the XR that render consumed was defaulted with the XR's CRD.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: parent-nop-claim-defaults-composition
spec:
  compositeTypeRef:
    apiVersion: claimnested.diff.example.org/v1alpha1
    kind: XParentNopClaim
  mode: Pipeline
  pipeline:
    - step: render-defaults
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}-defaults
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: defaults
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.tier }}/{{ .observed.composite.resource.spec.compositionUpdatePolicy }}
    - step: auto-ready
      functionRef:
        name: function-auto-ready
