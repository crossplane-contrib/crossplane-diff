# The CompositionRevision Crossplane creates for env-composition.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. The XR in existing-env-xr.yaml tracks it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: xenvresources.diff.example.org-fe2e10c
  labels:
    crossplane.io/composition-name: xenvresources.diff.example.org
    crossplane.io/composition-hash: fe2e10ca923a4f98980b43b5adc47f5c1dd0d51a173daee467fae63457a155d
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XEnvResource
  mode: Pipeline
  pipeline:
    - step: environmentConfigs
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: test-env-config
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{ $envConfig := index .context "apiextensions.crossplane.io/environment" }}
            apiVersion: nop.example.org/v1alpha1
            kind: XDownstreamEnvResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: env-resource
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.configKey }}
                region: {{ $envConfig.region }}
                environment: {{ $envConfig.environment }}
                serviceLevel: {{ $envConfig.serviceLevel }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
