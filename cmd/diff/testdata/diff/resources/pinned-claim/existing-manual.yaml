# A Manual claim bound to a backing XR that is pinned to revision 1, the older of the composition's two
# revisions: existing-manual-xr.yaml, whose composed resource, as revision 1 rendered it, is
# existing-manual-downstream.yaml. The claim carries no compositionRevisionRef: the claim syncer copies
# the ref back to a claim only under Automatic, so a Manual claim has one only if its author set it. The
# pin therefore lives on the backing XR alone.
apiVersion: pinned.diff.example.org/v1alpha1
kind: Pinned
metadata:
  name: manual-claim
  namespace: existing-namespace
spec:
  coolField: existing-value
  compositionUpdatePolicy: Manual
  compositionRef:
    name: xpinneds.pinned.diff.example.org
  resourceRef:
    apiVersion: pinned.diff.example.org/v1alpha1
    kind: XPinned
    name: manual-claim-x1y2z
