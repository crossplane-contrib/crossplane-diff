# An Automatic claim bound to a backing XR tracking revision 2, the latest: existing-automatic-xr.yaml,
# whose composed resource, as revision 2 rendered it, is existing-automatic-downstream.yaml. The claim
# carries the ref the claim syncer copies back from its XR under Automatic.
apiVersion: pinned.diff.example.org/v1alpha1
kind: Pinned
metadata:
  name: automatic-claim
  namespace: existing-namespace
spec:
  coolField: existing-value
  compositionUpdatePolicy: Automatic
  compositionRef:
    name: xpinneds.pinned.diff.example.org
  compositionRevisionRef:
    name: xpinneds.pinned.diff.example.org-rev2
  resourceRef:
    apiVersion: pinned.diff.example.org/v1alpha1
    kind: XPinned
    name: automatic-claim-a1b2c
