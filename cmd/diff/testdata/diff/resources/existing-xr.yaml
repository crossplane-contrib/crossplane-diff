# spec.crossplane.compositionUpdatePolicy is what any XR Crossplane has reconciled carries: the
# reconciler writes spec.crossplane, and the XR's generated CRD then defaults the policy.
apiVersion: ns.diff.example.org/v1alpha1
kind: XNopResource
metadata:
  name: test-resource
  namespace: default
spec:
  coolField: "existing-value"
  crossplane:
    compositionUpdatePolicy: Automatic
