# existing-xr.yaml as Crossplane leaves it once removal-test-composition.yaml has composed it, so it
# tracks that composition and its revision.
apiVersion: ns.diff.example.org/v1alpha1
kind: XNopResource
metadata:
  name: test-resource
  namespace: default
spec:
  coolField: "existing-value"
  crossplane:
    compositionRef:
      name: removal-test-composition
    compositionUpdatePolicy: Automatic
