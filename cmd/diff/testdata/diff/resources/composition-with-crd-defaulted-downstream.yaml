apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xnopresources-defaulted-downstream.diff.example.org
spec:
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          # spec.forProvider.size is deliberately not rendered: its CRD defaults it.
          template: |
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDefaultedDownstreamResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}-defaulted
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: defaulted-resource
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.coolField }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
