# A composition whose pipeline authors a `status` on the composed resource it renders.
#
# Composition pipelines are explicitly allowed to write their own status, so a rendered status is
# user-authored output rather than a stale read of the cluster. The composed kind here
# (XStatusResource) declares the status subresource, so the apiserver strips status from the dry-run
# create and returns an object with none — which means the status below can only reach the `+++`
# diff if the calculator re-attaches it (crossplane-diff#334, R6.2).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xnopresources.diff.example.org
spec:
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XStatusResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: status-resource
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.coolField }}
            status:
              phase: authored-by-composition
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
