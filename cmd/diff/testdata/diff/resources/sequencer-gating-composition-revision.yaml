# The CompositionRevision Crossplane creates for sequencer-gating-composition.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. The XRs in existing-sequencer-gating-xr.yaml and comp's
# existing-sequencer-gating-xr.yaml track it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: sequencer-gating-composition-6845979
  labels:
    crossplane.io/composition-name: sequencer-gating-composition
    crossplane.io/composition-hash: 6845979eb9b4fe88ee62e3070e4a4ab4a0be7b30bd026eebca538b1e1529772
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-all-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: 0-stage0-resource
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: stage0-resource
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.coolField }}
            ---
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: 1-stage1-resource
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: stage1-resource
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.coolField }}
    # auto-ready FIRST so sequencer sees desired.stage0.Ready reflecting observed.
    - step: mark-ready-from-observed
      functionRef:
        name: function-auto-ready
    - step: sequence-resources
      functionRef:
        name: function-sequencer
      input:
        apiVersion: sequencer.fn.crossplane.io/v1beta1
        kind: Input
        rules:
          - sequence:
              - ^stage0-  # Stage 0 (composition-resource-name starts with stage0-)
              - ^stage1-  # Stage 1 (gated until stage0- desired.Ready==True)
