# The CompositionRevision Crossplane creates for composition.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. The XRs in existing-xr.yaml, existing-xr-deleting.yaml,
# existing-xr-with-argocd.yaml and existing-other-xr.yaml track it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: xnopresources.diff.example.org-b616215
  labels:
    crossplane.io/composition-name: xnopresources.diff.example.org
    crossplane.io/composition-hash: b6162153aaf39292b08dc7d04bc2432186a771c067f80cd37153ed985c86d4d
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          # add namespace to serve v2
          template: |
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nop-resource
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.coolField }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
