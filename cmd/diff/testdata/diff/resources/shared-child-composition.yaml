# Composes one child with a FIXED name, whatever the XR is called, so two XRs using this composition
# in one namespace both render the same object. In the cluster the first XR to create it keeps it and
# the other fails to reconcile it, so crossplane-diff must refuse to combine their diffs (#476).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xnopresources-shared-child.diff.example.org
spec:
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-shared-child
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: shared-child
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: shared-child
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.coolField }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
