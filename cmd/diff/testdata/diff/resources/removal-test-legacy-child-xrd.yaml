# A legacy (v1) XR that a legacy XR composes, so a removal hierarchy at the v1 spec.resourceRefs path is
# two real XRs deep, as in a cluster: removal-test-legacy-nested-xr.yaml is one.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xlegacychildresources.legacycluster.diff.example.org
spec:
  group: legacycluster.diff.example.org
  names:
    kind: XLegacyChildResource
    plural: xlegacychildresources
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                childField:
                  type: string
