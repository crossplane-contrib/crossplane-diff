# An XRD unrelated to any input, applied with no generated CRD: one Crossplane has not established yet,
# so the apiserver serves neither its XR type nor its claim type.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xunestablishedresources.unrelated.example.org
spec:
  group: unrelated.example.org
  names:
    kind: XUnestablishedResource
    plural: xunestablishedresources
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                coolField:
                  type: string
