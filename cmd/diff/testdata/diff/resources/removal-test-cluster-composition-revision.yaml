# The CompositionRevision Crossplane creates for removal-test-cluster-composition.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. The XR in existing-cluster-xr.yaml tracks it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: removal-test-composition-988753d
  labels:
    crossplane.io/composition-name: removal-test-composition
    crossplane.io/composition-hash: 988753d44a60970bf99db5c2f5080fa67d9168d5d1f92c62f2d3d6f727f4475
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-remaining-resource
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: resource-to-be-kept
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: resource1
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.coolField }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
