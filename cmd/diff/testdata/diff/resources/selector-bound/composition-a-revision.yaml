# The CompositionRevision Crossplane creates for selector-bound-a in setup.yaml, named and labelled
# from its hash as Crossplane names it. envtest runs no Crossplane controllers, so it must be
# declared. The XR in existing-xr.yaml, which Crossplane bound to selector-bound-a, tracks it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: selector-bound-a-dc464c8
  labels:
    binding: "shared"
    crossplane.io/composition-name: selector-bound-a
    crossplane.io/composition-hash: dc464c8d4fbf6baa4870b0be7d779c712215bd06e92b1de992dc3a41cdb8089
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nop-resource
            spec:
              forProvider:
                configData: a-{{ .observed.composite.resource.spec.coolField }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
