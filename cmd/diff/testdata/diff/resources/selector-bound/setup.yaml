# Two compositions that both match one compositionSelector, and a composite Crossplane has already bound
# to the first, with that composite's composed resource. Crossplane selects a composition once, when
# the composite has no compositionRef, and never re-selects (composite.APILabelSelectorResolver), so
# the composite stays on composition A however many compositions its selector matches.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: selector-bound-a
  labels:
    binding: shared
spec:
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nop-resource
            spec:
              forProvider:
                configData: a-{{ .observed.composite.resource.spec.coolField }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: selector-bound-b
  labels:
    binding: shared
spec:
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nop-resource
            spec:
              forProvider:
                configData: b-{{ .observed.composite.resource.spec.coolField }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
---
apiVersion: ns.diff.example.org/v1alpha1
kind: XNopResource
metadata:
  name: selector-bound
  namespace: default
spec:
  coolField: existing-value
  crossplane:
    compositionSelector:
      matchLabels:
        binding: shared
    compositionRef:
      name: selector-bound-a
    compositionUpdatePolicy: Automatic
---
apiVersion: ns.nop.example.org/v1alpha1
kind: XDownstreamResource
metadata:
  name: selector-bound
  namespace: default
  annotations:
    crossplane.io/composition-resource-name: nop-resource
    gotemplating.fn.crossplane.io/composition-resource-name: nop-resource
  labels:
    crossplane.io/composite: selector-bound
spec:
  forProvider:
    configData: a-existing-value
