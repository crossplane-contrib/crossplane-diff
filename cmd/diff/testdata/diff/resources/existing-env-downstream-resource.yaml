# Deliberately no compositionRef or compositionRevisionRef. XDownstreamEnvResource is an XR kind (its
# XRD is xdownstreamenvresource-xrd.yaml), but no Composition targets it, so Crossplane can select
# none and never writes either ref. The diff likewise skips rendering it as a nested XR.
apiVersion: nop.example.org/v1alpha1
kind: XDownstreamEnvResource
metadata:
  annotations:
    crossplane.io/composition-resource-name: env-resource
  name: test-env-resource
spec:
  compositionUpdatePolicy: Automatic
  forProvider:
    configData: existing-config-value
    environment: staging
    region: us-west-2
    serviceLevel: premium