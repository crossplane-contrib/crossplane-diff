# The CompositionRevision Crossplane creates for child-revision-templating-composition.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. The nested XR in existing-child-xr-revision-ref.yaml tracks it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: xchildresources.nested.example.org-96afc06
  labels:
    crossplane.io/composition-name: xchildresources.nested.example.org
    crossplane.io/composition-hash: 96afc06020a6705c80a4717647a004233db1454abe39d04b220e39949f688bb
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: ns.nested.example.org/v1alpha1
    kind: XChildResource
  mode: Pipeline
  pipeline:
    - step: generate-managed-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}-managed
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: managed-resource
            spec:
              forProvider:
                configData: {{ .observed.composite.resource.spec.crossplane.compositionRevisionRef.name }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
