# The CompositionRevision Crossplane creates for parent-composition.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. The XR in existing-parent-xr.yaml tracks it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: xparentresources.nested.example.org-f2af16a
  labels:
    crossplane.io/composition-name: xparentresources.nested.example.org
    crossplane.io/composition-hash: f2af16a4bb0261903ad94fec23367ac1bf14e78f506e28b04c0627bfd27b27f
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: ns.nested.example.org/v1alpha1
    kind: XParentResource
  mode: Pipeline
  pipeline:
    - step: generate-child-xr
      functionRef:
        name: function-go-templating
      input:
        apiVersion: template.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: ns.nested.example.org/v1alpha1
            kind: XChildResource
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}-child
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: child-xr
            spec:
              childField: {{ .observed.composite.resource.spec.parentField }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
