# The CompositionRevision Crossplane creates for unguarded-external-res-gotpl-composition.yaml,
# named and labelled from its hash as Crossplane names it. envtest runs no Crossplane controllers,
# so it must be declared. The XR in existing-xr-with-external-dep-unguarded.yaml tracks it.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositionRevision
metadata:
  name: unguarded-templated-extra-resources.diff.example.org-4ad97d3
  labels:
    crossplane.io/composition-name: unguarded-templated-extra-resources.diff.example.org
    crossplane.io/composition-hash: 4ad97d39f5f1524bd756026fa318879701bcf613218eba8b9df6210daf8ec88
spec:
  revision: 1
  compositeTypeRef:
    apiVersion: ns.diff.example.org/v1alpha1
    kind: XNopResource
  mode: Pipeline
  pipeline:
    - step: render-templates
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              configmaps:
                apiVersion: v1
                kind: ConfigMap
                matchLabels:
                  app: test-app
                  environment: {{ .observed.composite.resource.spec.environment }}
            {{- $configMaps := index .extraResources "configmaps" }}
            {{- range $i, $configMap := $configMaps.items }}
            ---
            apiVersion: ns.nop.example.org/v1alpha1
            kind: XDownstreamResource
            metadata:
              name: {{ $.observed.composite.resource.metadata.name }}
              namespace: {{ $.observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nop-resource
            spec:
              forProvider:
                configData: {{ $.observed.composite.resource.spec.coolField }}
                roleName: templated-{{ $configMap.resource.metadata.name }}
            {{- end }}
