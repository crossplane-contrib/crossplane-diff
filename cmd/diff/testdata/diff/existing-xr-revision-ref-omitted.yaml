# testdata/comp/resources/existing-xr-revision-ref.yaml exactly as a user would write it: unchanged,
# but without the compositionRef and compositionRevisionRef that Crossplane's composite reconciler
# wrote into the cluster copy. Applying this leaves those refs where they are, so nothing would change —
# and the composition this composite uses (testdata/comp/resources/revision-templating-composition.yaml)
# reads the revision name into a composed resource. Only the inherited compositionRef resolves the
# revision whose name render must see, so a render that drops the cluster's refs shows a spurious
# change. See issue #499.
apiVersion: ns.diff.example.org/v1alpha1
kind: XNopResource
metadata:
  name: revision-ref-resource
  namespace: default
spec:
  coolField: revision-ref-existing-value
  crossplane:
    compositionUpdatePolicy: Automatic
