# testdata/comp/resources/existing-xr-revision-ref.yaml exactly as a user would write it: unchanged,
# but without the compositionRevisionRef that Crossplane's composite reconciler wrote into the cluster
# copy. Applying this leaves that ref where it is, so nothing would change — and the composition this
# composite uses (testdata/comp/resources/revision-templating-composition.yaml) reads the revision name
# into a composed resource, which makes a render that drops the ref show a spurious change. See issue
# #499.
apiVersion: ns.diff.example.org/v1alpha1
kind: XNopResource
metadata:
  name: revision-ref-resource
  namespace: default
spec:
  coolField: revision-ref-existing-value
  crossplane:
    compositionRef:
      name: xrevisionrefs.diff.example.org
    compositionUpdatePolicy: Automatic
