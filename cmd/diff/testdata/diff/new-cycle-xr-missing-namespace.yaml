# new-cycle-xr.yaml, but in a namespace that does not exist in the cluster.
#
# Every level of the XCycleA -> XCycleB cycle is an addition whose dry-run create is refused for want
# of its namespace, so each is diffed unverified before the cycle exceeds --max-nested-depth and the
# XR fails. Its diffs are then dropped, which is exactly when the unverified-addition warning must not
# be dropped with them.
apiVersion: ns.cycle.example.org/v1alpha1
kind: XCycleA
metadata:
  name: test-cycle
  namespace: nonexistent-namespace
spec:
  cycleField: "cycle-value"
