# A composed-resource kind that declares the status SUBRESOURCE.
#
# That declaration is the entire reason this CRD exists, and it is load-bearing rather than
# incidental: with `subresources: {status: {}}` the apiserver strips `status` from a CREATE request
# and hands back an object with no status at all. Every other CRD under testdata/diff/crds omits the
# subresource, so status is simply persisted on create there — which would make a status-retention
# assertion pass whether or not the diff calculator re-attached the rendered status, i.e. prove
# nothing.
#
# Used by resources/composition-with-status.yaml to check that a status authored by a composition
# pipeline survives the apiserver round-trip for an addition (crossplane-diff#334, R6.2).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: xstatusresources.ns.nop.example.org
spec:
  group: ns.nop.example.org
  names:
    kind: XStatusResource
    listKind: XStatusResourceList
    plural: xstatusresources
    singular: xstatusresource
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                forProvider:
                  type: object
                  properties:
                    configData:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "A status value written by the composition pipeline, not by the apiserver"
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      observedGeneration:
                        type: integer
                        format: int64
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
