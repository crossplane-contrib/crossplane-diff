# A CRD that serves two versions and stores the newer one, which defaults a field differently. A
# resource requested at v1alpha1 and predicted locally is defaulted against v1alpha1 only, so its
# unverified-addition warning must name the storage version (#528).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: xversioneddownstreamresources.ns.nop.example.org
spec:
  group: ns.nop.example.org
  names:
    kind: XVersionedDownstreamResource
    listKind: XVersionedDownstreamResourceList
    plural: xversioneddownstreamresources
    singular: xversioneddownstreamresource
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                forProvider:
                  type: object
                  properties:
                    configData:
                      type: string
                    size:
                      type: string
                      default: "small"
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                forProvider:
                  type: object
                  properties:
                    configData:
                      type: string
                    size:
                      type: string
                      default: "medium"
