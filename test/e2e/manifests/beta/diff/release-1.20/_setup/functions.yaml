# Pull from xpkg.crossplane.io, not xpkg.upbound.io: the latter answers GitHub-hosted runners with HTTP 429, so
# packages never install there (see the main suite's _setup/functions.yaml).
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  # the earliest release published to xpkg.crossplane.io (v0.7.0 was only ever on xpkg.upbound.io)
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.8.2
---
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-go-templating
spec:
  # used by v1-claim-nested's parent composition; the version main's _setup pinned when that test was added
  package: xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.11.0
---
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-auto-ready
spec:
  # the earliest release published to xpkg.crossplane.io (v0.3.0 was only ever on xpkg.upbound.io)
  package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.4.2
